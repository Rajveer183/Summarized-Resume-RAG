# Cloud Run frontend nginx config.
#
# Differs from frontend/nginx.conf (used by local docker-compose) in one way:
# it does NOT proxy /categories, /generate-resume, etc. to a "backend"
# hostname. That hostname only resolves inside the docker-compose network;
# on Cloud Run there is no shared network namespace between services, and
# nginx would fail to start (upstream host not found) if it tried to
# resolve "backend" at boot. Instead, the frontend build bakes in
# VITE_API_URL (the deployed backend's Cloud Run URL) at build time, so
# frontend/src/api/resumeApi.js calls the backend directly over HTTPS —
# no reverse proxy needed on this side.
server {
    listen 8080;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
